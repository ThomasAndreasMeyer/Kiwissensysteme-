<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vielen Dank | KI Wissenssysteme</title>
    <meta name="robots" content="noindex"> <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <style>
        :root {
            --primary: #0f172a;
            --accent: #0284c7;
            --soft-blue: #f0f9ff;
            --text-main: #334155;
            --white: #ffffff;
            --transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: radial-gradient(circle at center, #f8fafc 0%, #e2e8f0 100%);
            color: var(--text-main); 
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
        }

        .success-card {
            background: var(--white);
            padding: 60px 40px;
            border-radius: 40px;
            box-shadow: 0 30px 60px rgba(15, 23, 42, 0.1);
            max-width: 550px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.8);
            position: relative;
        }

        .icon-check {
            width: 80px;
            height: 80px;
            background: #10b981; /* Success Green */
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 30px;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
        }

        h1 {
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 20px;
            letter-spacing: -1.5px;
            line-height: 1.2;
        }

        p {
            font-size: 1.1rem;
            color: #64748b;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            padding: 18px 35px;
            background: var(--primary);
            color: white;
            text-decoration: none;
            border-radius: 14px;
            font-weight: 700;
            transition: var(--transition);
        }

        .btn-home:hover {
            background: var(--accent);
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(2, 132, 199, 0.3);
        }

        .footer-note {
            margin-top: 40px;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        /* Dekorative Elemente */
        .blob {
            position: absolute;
            width: 200px;
            height: 200px;
            background: var(--soft-blue);
            filter: blur(50px);
            z-index: -1;
            border-radius: 50%;
        }
    </style>
</head>
<body>

    <div class="blob" style="top: -50px; right: -50px;"></div>
    <div class="blob" style="bottom: -50px; left: -50px; background: #e0f2fe;"></div>

    <main class="success-card animate__animated animate__zoomIn">
        <div class="icon-check animate__animated animate__bounceIn animate__delay-1s">
            ✓
        </div>
        
        <h1>Vielen Dank für Ihre Anfrage!</h1>
        
        <p>
            Ihre Nachricht wurde erfolgreich übermittelt. <br>
            Ein KI-Experte aus unserem Team wird sich <strong>innerhalb der nächsten 24 Stunden</strong> bei Ihnen melden.
        </p>

        <a href="index.html" class="btn-home">
            Zurück zur Startseite
        </a>

        <div class="footer-note">
            In dringenden Fällen erreichen Sie uns auch telefonisch unter:<br>
            <strong>+49 175 35666494</strong>
        </div>
    </main>

</body>
</html>
